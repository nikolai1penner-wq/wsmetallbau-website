name: Bilder importieren
# Einmalig manuell starten: lädt die Fotos von ws-edelstahlbau.de und committet sie ins Repo.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/import-bilder.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bilder src/data/bilder.json
          git commit -m "Projektfotos von ws-edelstahlbau.de importieren" || echo "Keine Änderungen"
          git pull --rebase && git push
